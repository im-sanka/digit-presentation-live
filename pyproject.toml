[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthesis-check"
version = "1.0.0"
description = "Will a vendor manage to build this DNA construct? Features, model, HTTP API and MCP server."
requires-python = ">=3.10"
dependencies = ["pandas>=1.4", "scikit-learn>=1.2"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.2"]

[tool.setuptools.packages.find]
where = ["backend"]
