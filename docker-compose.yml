# docker compose up          the app on :8501 and the API on :8000
# docker compose up app      just the app
services:
  app:
    build: .
    ports:
      - "8501:8501"

  api:
    build: .
    command: ["uvicorn", "synthesis_check.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
